<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneRoute — Login</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary:        #0F2B46;
      --primary-hover:  #081d31;
      --accent:         #2E8540;
      --accent-hover:   #256e35;
      --accent-light:   #e8f5ec;
      --accent-border:  #b7dfc2;
      --text:           #1a2b3d;
      --muted:          #5a6a7a;
      --border:         #d4dae0;
      --surface:        #f4f6f8;
      --background:     #ffffff;
      --radius:         8px;
      --radius-sm:      6px;
      --shadow:         0 4px 20px rgba(15, 43, 70, 0.08);
      --transition:     0.18s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: var(--surface);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 32px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.4px;
      margin-bottom: 4px;
    }

    .brand-header p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .role-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .role-btn {
      flex: 1;
      padding: 10px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition);
    }

    .role-btn:hover {
      color: var(--primary);
      border-color: #b0bac5;
    }

    .role-btn.active {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 11px 14px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: #fafbfc;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .input-group input:focus {
      border-color: var(--accent);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(46, 133, 64, 0.12);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      transition: background var(--transition);
      margin-top: 8px;
    }

    .login-btn:hover {
      background: var(--accent-hover);
    }

    .error {
      color: #b91c1c;
      text-align: center;
      margin-top: 14px;
      font-size: 12.5px;
      font-weight: 500;
      min-height: 18px;
    }

    .demo-info {
      margin-top: 24px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    .demo-info b {
      color: var(--primary);
    }

    .signup-link-wrap {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }

    .signup-link-wrap a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      margin-left: 4px;
    }

    .signup-link-wrap a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <div class="brand-header">
      <h1>OneRoute</h1>
      <p>University Student Support &amp; Triage Portal</p>
    </div>

    <!-- Role Selection -->
    <div class="role-buttons">
      <button class="role-btn active" id="studentBtn" type="button" onclick="selectRole('student')">
        Student
      </button>
      <button class="role-btn" id="adminBtn" type="button" onclick="selectRole('admin')">
        Staff / Admin
      </button>
    </div>

    <!-- Login Form -->
    <form onsubmit="login(event)">
      <div class="input-group">
        <label for="email">University Email</label>
        <input
          type="email"
          id="email"
          placeholder="e.g. alex@student or officer@admin"
          value="alex@student"
          required
        />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter password"
          value="1234"
          required
        />
      </div>

      <button class="login-btn" type="submit">
        Sign In
      </button>

      <div class="error" id="errorMessage"></div>

      <div class="signup-link-wrap">
        Don't have an account?
        <a href="signup.html">Create Account</a>
      </div>
    </form>

    <!-- Demo Credentials Hint -->
    <div class="demo-info">
      <b>Demo Accounts:</b><br />
      Student: <b>alex@student</b> &middot; Password: <b>1234</b><br />
      Staff: <b>officer@admin</b> &middot; Password: <b>1234</b>
    </div>
  </div>

  <script>
    let selectedRole = "student";

    function selectRole(role) {
      selectedRole = role;
      const studentBtn = document.getElementById("studentBtn");
      const adminBtn = document.getElementById("adminBtn");
      const emailInput = document.getElementById("email");

      if (role === "student") {
        studentBtn.classList.add("active");
        adminBtn.classList.remove("active");
        if (emailInput.value === "officer@admin") emailInput.value = "alex@student";
      } else {
        adminBtn.classList.add("active");
        studentBtn.classList.remove("active");
        if (emailInput.value === "alex@student") emailInput.value = "officer@admin";
      }

      document.getElementById("errorMessage").innerText = "";
    }

    function login(event) {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorMessage = document.getElementById("errorMessage");

      errorMessage.innerText = "";

      if (password.length < 4) {
        errorMessage.innerText = "Password must be at least 4 characters.";
        return;
      }

      const rawPrefix = email.split('@')[0];
      const displayName = rawPrefix.charAt(0).toUpperCase() + rawPrefix.slice(1);

      if (selectedRole === "student") {
        if (email.endsWith("@student") || !email.includes("@admin")) {
          const userData = {
            name: displayName + (displayName.toLowerCase() === 'alex' ? ' Mercer' : ''),
            userId: 'STU-2310482',
            role: "student"
          };
          localStorage.setItem("supportAIUser", JSON.stringify(userData));
          window.location.href = "student.html";
        } else {
          errorMessage.innerText = "Student accounts must not end with @admin.";
        }
      } else {
        if (email.endsWith("@admin") || email.includes("admin") || email.includes("officer")) {
          const userData = {
            name: displayName + ' Officer',
            userId: 'ADM-9021',
            role: "admin"
          };
          localStorage.setItem("supportAIUser", JSON.stringify(userData));
          window.location.href = "admin.html";
        } else {
          errorMessage.innerText = "Admin accounts must end with @admin (e.g. officer@admin).";
        }
      }
    }
  </script>
</body>
</html>
