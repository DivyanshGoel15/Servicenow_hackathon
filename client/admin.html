function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function student(id, caseObj){
  if(caseObj && caseObj.studentName){
    return {
      name: caseObj.studentName,
      email: (caseObj.studentId && caseObj.studentId.includes('@')) ? caseObj.studentId : `${id}@student.university.ac.uk`,
      course: 'Undergraduate Studies',
      year: 'Year 2'
    };
  }
  return students.find(s=>s.id===id)||{name:'Current Student',email:id?`${id}@student.university.ac.uk`:'',course:'Undergraduate Studies',year:'Year 2'};
}
function service(id){return services.find(s=>s.id===id)||{name:id}}
function fmt(iso){return new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'UTC'}).format(new Date(iso))}
function pc(p){return p==='High'?'p-high':p==='Medium'?'p-medium':'p-low'}
function sc(s){return s==='New'?'s-new':s==='Assigned'?'s-assigned':s==='In Progress'?'s-progress':'s-resolved'}
function priorityPill(p){return `<span class="pill ${pc(p)}">${p}</span>`}
function statusPill(s){return `<span class="pill ${sc(s)}">${s}</span>`}
function renderHeader(title,desc,actions=''){return `<div class="header"><div><h1>${title}</h1><p>${desc}</p></div>${actions}</div>`}

function getSortedRecentCases(){
  let list = [...cases];
  const priorityOrder = { 'High': 3, 'Medium': 2, 'Low': 1 };
  const statusOrder = { 'New': 1, 'Assigned': 2, 'In Progress': 3, 'Resolved': 4 };
  
  if (recentSort === 'priority-desc') {
    list.sort((a,b) => (priorityOrder[b.priority] || 0) - (priorityOrder[a.priority] || 0));
  } else if (recentSort === 'priority-asc') {
    list.sort((a,b) => (priorityOrder[a.priority] || 0) - (priorityOrder[b.priority] || 0));
  } else if (recentSort === 'status') {
    list.sort((a,b) => (statusOrder[a.status] || 0) - (statusOrder[b.status] || 0));
  } else if (recentSort === 'status-resolved') {
    list.sort((a,b) => (statusOrder[b.status] || 0) - (statusOrder[a.status] || 0));
  } else if (recentSort === 'student') {
    list.sort((a,b) => {
      let sa = student(a.studentId, a).name.toLowerCase();
      let sb = student(b.studentId, b).name.toLowerCase();
      return sa.localeCompare(sb);
    });
  } else if (recentSort === 'id') {
    list.sort((a,b) => b.id.localeCompare(a.id));
  } else {
    // Default: newest first by createdAt
    list.sort((a,b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
  }
  return list.slice(0, 8);
}

function setRecentSort(val){
  recentSort = val;
  render();
  const sortLabels = {
    'newest': 'Newest First',
    'priority-desc': 'Priority (High to Low)',
    'priority-asc': 'Priority (Low to High)',
    'status': 'Status (New to Resolved)',
    'status-resolved': 'Status (Resolved First)',
    'student': 'Student Name (A to Z)',
    'id': 'Case ID'
  };
  toast('Recent cases sorted by ' + (sortLabels[val] || val));
}

function cycleSort(col){
  if (col === 'priority') {
    if (recentSort === 'priority-desc') setRecentSort('priority-asc');
    else if (recentSort === 'priority-asc') setRecentSort('newest');
    else setRecentSort('priority-desc');
  } else if (col === 'status') {
    if (recentSort === 'status') setRecentSort('status-resolved');
    else if (recentSort === 'status-resolved') setRecentSort('newest');
    else setRecentSort('status');
  } else if (col === 'student') {
    setRecentSort(recentSort === 'student' ? 'newest' : 'student');
  } else if (col === 'id') {
    setRecentSort(recentSort === 'id' ? 'newest' : 'id');
  }
}

function openAddServiceModal(){
  const m = document.getElementById('serviceModalBackdrop');
  if(m) m.classList.add('open');
}
function closeAddServiceModal(){
  const m = document.getElementById('serviceModalBackdrop');
  if(m) m.classList.remove('open');
  const form = document.getElementById('addServiceForm');
  if(form) form.reset();
}
function handleAddService(e){
  e.preventDefault();
  const name = document.getElementById('newServiceName').value.trim();
  const category = document.getElementById('newServiceCategory').value;
  const lead = document.getElementById('newServiceLead').value.trim();
  const responseTarget = document.getElementById('newServiceTarget').value.trim();
  const description = document.getElementById('newServiceDesc').value.trim();
  if(!name || !lead) return;
  const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  services.push({
    id: id,
    name: name,
    category: category,
    lead: lead,
    responseTarget: responseTarget,
    description: description,
    email: id + '@university.ac.uk'
  });
  try {
    localStorage.setItem('oneRoute_services', JSON.stringify(services));
  } catch(err){}
  closeAddServiceModal();
  toast('Support service "' + name + '" added successfully');
  render();
}
function deleteService(id){
  const found = services.find(s=>s.id===id);
  if(!found) return;
  if(confirm('Are you sure you want to delete the service "' + found.name + '"?')){
    services = services.filter(s=>s.id!==id);
    try {
      localStorage.setItem('oneRoute_services', JSON.stringify(services));
    } catch(err){}
    toast('Service "' + found.name + '" removed');
    render();
  }
}

"><div class="avatar">${esc(s.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><div><b style="font-size:12px">${esc(s.name)}</b><div style="font-size:10px;color:#7c8490">${esc(s.email)}</div></div></div><div style="margin-top:14px;font-size:10px;line-height:1.8;color:#687181"><b>Student ID:</b> ${s.id}<br><b>Course:</b> ${esc(s.course)}<br><b>Year:</b> ${esc(s.year)}</div></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><h2>Assigned services</h2></div><div style="padding:14px">${c.serviceIds.map(id=>`<div style="padding:10px 0;border-bottom:1px solid #edf0f3;font-size:11px">${esc(service(id).name)}<div style="font-size:10px;color:#7a8290;margin-top:3px">${esc(service(id).lead)}</div></div>`).join('')}</div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><h2>Case status</h2></div><div style="padding:14px"><select style="width:100%;padding:8px;border:1px solid #dfe3e9;border-radius:6px;font-size:11px" onchange="updateCaseStatus('${c.id}',this.value)">${['New','Assigned','In Progress','Resolved'].map(x=>`<option ${x===c.status?'selected':''}>${x}</option>`).join('')}</select></div></div></div></div></div>`}
function navigate(p){currentPage=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));selectedCase=null;render()}
function render(){if(selectedCase){page.innerHTML=caseDetail(selectedCase);return}let html=currentPage==='dashboard'?dashboard():currentPage==='cases'?casesPage():currentPage==='services'?servicesPage():currentPage==='students'?studentsPage():reportsPage();page.innerHTML=html}
function filterCases(){let q=(document.getElementById('caseSearch')?.value||'').toLowerCase(),p=document.getElementById('priorityFilter')?.value||'',s=document.getElementById('statusFilter')?.value||'';let list=cases.filter(c=>{let st=student(c.studentId, c);return (!q||[c.id,c.need,c.request,st.name,st.course].join(' ').toLowerCase().includes(q))&&(!p||c.priority===p)&&(!s||c.status===s)});document.getElementById('caseTable').innerHTML=table(list)}
function openCase(id){selectedCase=cases.find(c=>c.id===id);render()}
function updateCaseStatus(id,status){
  let c=cases.find(x=>x.id===id);
  if(c){
    c.status=status;
    try {
      localStorage.setItem('oneRoute_cases', JSON.stringify(cases));
      localStorage.setItem('supportAICases', JSON.stringify(cases));
    } catch(e){}
    fetch('/api/cases/' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: status })
    }).catch(()=>{});
    toast('Case status updated to ' + status);
    render();
  }
}
function openReasoning(id){
  let c=cases.find(x=>x.id===id);
  if(!c)return;
  let a=analyses[id]||{score:50,factors:[['General enquiry','Medium','No specific risk indicators found.']],explanation:'This request did not match any specific risk indicators, so it was given a standard priority.'};
  document.getElementById('sheet-sub').textContent=`${c.id} · ${c.need}`;
  document.getElementById('sheetBody').innerHTML=`<div class="sec"><h3>Priority</h3><div class="scorebox"><div><small>Priority level</small>${priorityPill(c.priority)}</div><div style="text-align:right"><small>Priority score</small><div class="score">${a.score}<span style="font-size:12px;color:#78808e">/100</span></div></div></div><div class="scorebar"><i style="width:${a.score}%"></i></div></div><div class="sec"><h3>Why was this prioritized?</h3><div style="font-size:10px;color:#7a8290;margin-bottom:8px">The primary factors evaluated by triage analysis:</div>${a.factors.map(f=>`<div class="factor"><div><b>${esc(f[0])}</b><p>${esc(f[2])}</p></div><span class="impact ${f[1].toLowerCase()}">${f[1]} impact</span></div>`).join('')}</div><div class="sec"><h3>AI Explanation</h3><div class="explain">Triage Analysis: ${esc(a.explanation)}</div></div><div class="feedback"><div class="sec"><h3>Staff Feedback</h3><div style="font-size:11px;font-weight:600;margin-bottom:8px">Was this AI assessment accurate?</div><div class="choice"><button id="goodBtn" onclick="setAccurate(true)">Accurate</button><button id="badBtn" onclick="setAccurate(false)">Needs Revision</button></div></div><div class="sec"><h3>Priority Rating (1 to 5)</h3><div class="stars" style="gap:6px">${[1,2,3,4,5].map(n=>`<button id="star${n}" class="btn-num" onclick="setRating(${n})">${n}</button>`).join('')}</div></div><div class="sec"><label style="font-size:11px;font-weight:600">Additional feedback <span style="font-weight:400;color:#7a8290">(optional)</span></label><textarea id="feedbackText" maxlength="1000" placeholder="e.g. Priority should be adjusted due to verified student documentation."></textarea></div><button class="btn primary submit" onclick="submitFeedback('${id}')">Submit Feedback</button><div id="feedbackHint" style="text-align:center;color:#7a8290;font-size:9px;margin-top:7px">Select Accurate or Needs Revision to submit.</div></div>`;
  feedback={accurate:null,rating:null,comment:''};
  document.getElementById('sheetBackdrop').classList.add('open');
}
function setAccurate(v){feedback.accurate=v;document.getElementById('goodBtn').className=v?'sel-good':'';document.getElementById('badBtn').className=!v?'sel-bad':'';document.getElementById('feedbackHint').textContent=''}
function setRating(v){feedback.rating=v;[1,2,3,4,5].forEach(n=>document.getElementById('star'+n).classList.toggle('on',n===v))}
function submitFeedback(id){
  if(feedback.accurate===null){
    document.getElementById('feedbackHint').textContent='Select Accurate or Needs Revision to submit.';
    return;
  }
  feedback.comment=document.getElementById('feedbackText').value.trim();
  document.getElementById('sheetBody').innerHTML=`<div style="padding:45px 15px;text-align:center"><div style="font-size:14px;font-weight:700;color:#2e8540;margin-bottom:6px">Feedback Recorded</div><p style="font-size:11px;color:#7a8290;line-height:1.5">Thank you. Your assessment feedback will be used to calibrate automated case triage.</p></div>`;
  toast('Feedback submitted for '+id);
}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',2600)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
document.getElementById('closeSheet').onclick=()=>document.getElementById('sheetBackdrop').classList.remove('open');
document.getElementById('sheetBackdrop').addEventListener('click',e=>{if(e.target.id==='sheetBackdrop')e.currentTarget.classList.remove('open')});
render();
</script>
</body>
</html>
