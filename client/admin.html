  const ra = localStorage.getItem('oneRoute_analyses');
  if (ra) storedAnalyses = JSON.parse(ra);
} catch(e) {}

  ...storedCases,
  ...defaultCases.filter(d => !storedCases.some(s => (s.id === d.id || s.caseId === d.id)))
];
let analyses = Object.assign({}, defaultAnalyses, storedAnalyses);
let currentPage='dashboard', selectedCase=null, feedback={accurate:null,rating:null,comment:''};
const page=document.getElementById('page');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function student(id, caseObj){
  if(caseObj && caseObj.studentName){
    return {
      name: caseObj.studentName,
      email: (caseObj.studentId && caseObj.studentId.includes('@')) ? caseObj.studentId : `${id}@student.university.ac.uk`,
      course: 'Undergraduate Studies',
      year: 'Year 2'
    };
  }
  return students.find(s=>s.id===id)||{name:'Current Student',email:id?`${id}@student.university.ac.uk`:'',course:'Undergraduate Studies',year:'Year 2'};
}
function service(id){return services.find(s=>s.id===id)||{name:id}}

function pc(p){return p==='High'?'p-high':p==='Medium'?'p-medium':'p-low'}
function sc(s){return s==='New'?'s-new':s==='Assigned'?'s-assigned':s==='In Progress'?'s-progress':'s-resolved'}
function priorityPill(p){return `<span class="pill ${pc(p)}">${p}</span>`}
function statusPill(s){return `<span class="pill ${sc(s)}">${s}</span>`}
function renderHeader(title,desc,actions=''){return `<div class="header"><div><h1>${title}</h1><p>${desc}</p></div>${actions}</div>`}
function caseRows(list,compact=false){return list.map(c=>{let s=student(c.studentId, c);return `<tr><td><button class="view" onclick="openCase('${c.id}')">${c.id}</button></td><td><b style="font-size:11px">${esc(s.name)}</b><div style="font-size:10px;color:#818997">${esc(s.course)}</div></td><td>${esc(c.need)}</td><td>${priorityPill(c.priority)}</td><td>${statusPill(c.status)}</td><td>${c.serviceIds.map(id=>esc(service(id).name)).join(', ')}</td><td><button class="btn ai" onclick="openReasoning('${c.id}')">✦ AI Reasoning</button></td></tr>`}).join('')}
function table(list){return `<div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Case ID</th><th>Student</th><th>Support Need</th><th>Priority</th><th>Status</th><th>Assigned Service</th><th></th></tr></thead><tbody>${caseRows(list)||`<tr><td colspan="7"><div class="empty">No cases found.</div></td></tr>`}</tbody></table></div></div>`}
function dashboard(){let high=cases.filter(c=>c.priority==='High').length,newc=cases.filter(c=>c.status==='New').length,progress=cases.filter(c=>c.status==='In Progress').length,res=cases.filter(c=>c.status==='Resolved').length;let recent=cases.slice(0,6);let counts=services.map(s=>({s,count:cases.filter(c=>c.serviceIds.includes(s.id)).length})).filter(x=>x.count).sort((a,b)=>b.count-a.count);return renderHeader('Dashboard','Overview of incoming student support cases for Monday, 5 October 2026')+`<div class="content" style="padding-top:0"><div class="cards"><div class="card"><div class="card-label">New Cases</div><div class="metric">${newc}</div><div class="metric-note">Awaiting action</div></div><div class="card"><div class="card-label">High Priority</div><div class="metric">${high}</div><div class="metric-note">Require prompt attention</div></div><div class="card"><div class="card-label">In Progress</div><div class="metric">${progress}</div><div class="metric-note">Currently being handled</div></div><div class="card"><div class="card-label">Resolved</div><div class="metric">${res}</div><div class="metric-note">Completed cases</div></div></div><div class="grid"><div><div class="panel"><div class="panel-head"><h2>Recent Cases</h2><button class="view" onclick="navigate('cases')">View all cases →</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Case</th><th>Student</th><th>Need</th><th>Priority</th><th>Status</th><th>AI</th></tr></thead><tbody>${recent.map(c=>{let s=student(c.studentId, c);return `<tr><td><button class="view" onclick="openCase('${c.id}')">${c.id}</button></td><td><b>${esc(s.name)}</b></td><td>${esc(c.need)}</td><td>${priorityPill(c.priority)}</td><td>${statusPill(c.status)}</td><td><button class="btn ai" onclick="openReasoning('${c.id}')">✦</button></td></tr>`}).join('')}</tbody></table></div></div></div><div class="panel"><div class="panel-head"><h2>Service Workload</h2><span>Active cases</span></div><div class="workload">${counts.map(x=>`<div class="work"><div class="work-row"><span>${esc(x.s.name)}</span><b>${x.count}</b></div><div class="bar"><i style="width:${Math.round(x.count/Math.max(...counts.map(y=>y.count))*100)}%"></i></div></div>`).join('')}</div></div></div></div>`}
function casesPage(){return renderHeader('Cases','View, triage and route incoming student support cases.')+`<div class="content" style="padding-top:0"><div class="filters" style="margin-bottom:14px"><input id="caseSearch" placeholder="Search case, student or request…" oninput="filterCases()"><select id="priorityFilter" onchange="filterCases()"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select><select id="statusFilter" onchange="filterCases()"><option value="">All statuses</option><option>New</option><option>Assigned</option><option>In Progress</option><option>Resolved</option></select></div><div id="caseTable">${table(cases)}</div></div>`}
function servicesPage(){return renderHeader('Services','University support services available for case routing.')+`<div class="content" style="padding-top:0"><div class="service-grid">${services.map(s=>`<div class="service-card"><h3>${esc(s.name)}</h3><span class="pill p-low">${esc(s.category)}</span><p>${esc(s.description)}</p><div class="service-meta"><b>Lead:</b> ${esc(s.lead)}<br><b>Target:</b> ${esc(s.responseTarget)}<br><b>Cases:</b> ${cases.filter(c=>c.serviceIds.includes(s.id)).length}</div></div>`).join('')}</div></div>`}
function studentsPage(){return renderHeader('Students','Student directory associated with support cases.')+`<div class="content" style="padding-top:0"><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Student ID</th><th>Name</th><th>Course</th><th>Year</th><th>Cases</th></tr></thead><tbody>${students.map(s=>`<tr><td>${s.id}</td><td><b>${esc(s.name)}</b><div style="font-size:10px;color:#818997">${esc(s.email)}</div></td><td>${esc(s.course)}</td><td>${esc(s.year)}</td><td>${cases.filter(c=>c.studentId===s.id).length}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function reportsPage(){let total=cases.length,avg=Math.round(cases.reduce((a,c)=>a+(analyses[c.id]?.score||50),0)/total),high=cases.filter(c=>c.priority==='High').length;let cats={};cases.forEach(c=>c.need.split(' + ').forEach(n=>cats[n]=(cats[n]||0)+1));return renderHeader('Reports','High-level view of triage patterns and service demand.')+`<div class="content" style="padding-top:0"><div class="cards"><div class="card"><div class="card-label">Total Cases</div><div class="metric">${total}</div></div><div class="card"><div class="card-label">High Priority</div><div class="metric">${high}</div></div><div class="card"><div class="card-label">Avg AI Score</div><div class="metric">${avg}</div></div><div class="card"><div class="card-label">Services</div><div class="metric">${services.length}</div></div></div><div class="report-grid"><div class="panel"><div class="panel-head"><h2>Cases by Support Need</h2></div><div class="bars" style="padding:4px 18px 18px">${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><div class="row-head"><span>${esc(k)}</span><b>${v}</b></div><div class="fill"><i style="width:${v/Math.max(...Object.values(cats))*100}%"></i></div></div>`).join('')}</div></div><div class="panel"><div class="panel-head"><h2>Priority Distribution</h2></div><div class="bars" style="padding:4px 18px 18px"><div class="row"><div class="row-head"><span>High</span><b>${high}</b></div><div class="fill"><i style="width:${high/total*100}%"></i></div></div><div class="row"><div class="row-head"><span>Medium</span><b>${cases.filter(c=>c.priority==='Medium').length}</b></div><div class="fill"><i style="width:${cases.filter(c=>c.priority==='Medium').length/total*100}%"></i></div></div><div class="row"><div class="row-head"><span>Low</span><b>${cases.filter(c=>c.priority==='Low').length}</b></div><div class="fill"><i style="width:${cases.filter(c=>c.priority==='Low').length/total*100}%"></i></div></div></div></div></div></div>`}
function caseDetail(c){let s=student(c.studentId, c);let analysis=analyses[c.id]||{score:50,factors:[['General enquiry','Medium','No specific risk indicators found.']],explanation:'This request did not match any specific risk indicators, so it was given a standard priority.'};return renderHeader('Case '+c.id,`${s.name} · ${c.need}`,`<button class="btn" onclick="navigate('cases')">← Back to cases</button>`)+`<div class="content" style="padding-top:0"><div class="detail-grid"><div><div class="panel request"><h2 class="section-title">Student request</h2><blockquote>${esc(c.request)}</blockquote></div><div class="panel" style="margin-top:16px"><div class="panel-head"><h2>AI triage summary</h2><button class="btn ai" onclick="openReasoning('${c.id}')">✦ View AI Reasoning</button></div><div class="info-grid"><div class="info"><label>Detected needs</label><strong>${esc(c.need)}</strong></div><div class="info"><label>Confidence</label><strong>${c.confidence}%</strong></div><div class="info"><label>Priority</label><strong>${priorityPill(c.priority)}</strong></div><div class="info"><label>Channel</label><strong>${esc(c.channel)}</strong></div></div><div style="padding:0 18px 18px;font-size:11px;color:#687181;line-height:1.5">${esc(c.triageSummary)}</div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><h2>Case timeline</h2></div><div class="timeline">${[{label:'Case created',actor:'Student portal',at:c.createdAt},{label:'AI triage completed',actor:'Triage Assistant',at:new Date(new Date(c.createdAt).getTime()+60000).toISOString()},...c.serviceIds.map((id,i)=>({label:'Routed to '+service(id).name,actor:'Routing Engine',at:new Date(new Date(c.createdAt).getTime()+(2+i)*60000).toISOString()}))].map(e=>`<div class="event"><b>${esc(e.label)}</b><p>${esc(e.actor)} · ${fmt(e.at)}</p></div>`).join('')}</div></div></div><div><div class="panel"><div class="panel-head"><h2>Student</h2></div><div style="padding:16px"><div style="display:flex;gap:10px;align-items:center"><div class="avatar">${esc(s.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><div><b style="font-size:12px">${esc(s.name)}</b><div style="font-size:10px;color:#7c8490">${esc(s.email)}</div></div></div><div style="margin-top:14px;font-size:10px;line-height:1.8;color:#687181"><b>Student ID:</b> ${s.id}<br><b>Course:</b> ${esc(s.course)}<br><b>Year:</b> ${esc(s.year)}</div></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><h2>Assigned services</h2></div><div style="padding:14px">${c.serviceIds.map(id=>`<div style="padding:10px 0;border-bottom:1px solid #edf0f3;font-size:11px">${esc(service(id).name)}<div style="font-size:10px;color:#7a8290;margin-top:3px">${esc(service(id).lead)}</div></div>`).join('')}</div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><h2>Case status</h2></div><div style="padding:14px"><select style="width:100%;padding:8px;border:1px solid #dfe3e9;border-radius:6px;font-size:11px" onchange="updateCaseStatus('${c.id}',this.value)">${['New','Assigned','In Progress','Resolved'].map(x=>`<option ${x===c.status?'selected':''}>${x}</option>`).join('')}</select></div></div></div></div></div>`}
function navigate(p){currentPage=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));selectedCase=null;render()}
function render(){if(selectedCase){page.innerHTML=caseDetail(selectedCase);return}let html=currentPage==='dashboard'?dashboard():currentPage==='cases'?casesPage():currentPage==='services'?servicesPage():currentPage==='students'?studentsPage():reportsPage();page.innerHTML=html}
function filterCases(){let q=(document.getElementById('caseSearch')?.value||'').toLowerCase(),p=document.getElementById('priorityFilter')?.value||'',s=document.getElementById('statusFilter')?.value||'';let list=cases.filter(c=>{let st=student(c.studentId, c);return (!q||[c.id,c.need,c.request,st.name,st.course].join(' ').toLowerCase().includes(q))&&(!p||c.priority===p)&&(!s||c.status===s)});document.getElementById('caseTable').innerHTML=table(list)}
function openCase(id){selectedCase=cases.find(c=>c.id===id);render()}
function updateCaseStatus(id,status){
  let c=cases.find(x=>x.id===id);
  if(c){
    c.status=status;
    try {
      localStorage.setItem('oneRoute_cases', JSON.stringify(cases));
      localStorage.setItem('supportAICases', JSON.stringify(cases));
    } catch(e){}
    fetch('/api/cases/' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: status })
    }).catch(()=>{});
    toast('Case status updated to ' + status);
    render();
  }
}
function openReasoning(id){let c=cases.find(x=>x.id===id);if(!c)return;let a=analyses[id]||{score:50,factors:[['General enquiry','Medium','No specific risk indicators found.']],explanation:'This request did not match any specific risk indicators, so it was given a standard priority.'};document.getElementById('sheet-sub').textContent=`${c.id} · ${c.need}`;document.getElementById('sheetBody').innerHTML=`<div class="sec"><h3>Priority</h3><div class="scorebox"><div><small>Priority level</small>${priorityPill(c.priority)}</div><div style="text-align:right"><small>Priority score</small><div class="score">${a.score}<span style="font-size:12px;color:#78808e">/100</span></div></div></div><div class="scorebar"><i style="width:${a.score}%"></i></div></div><div class="sec"><h3>Why was this prioritized?</h3><div style="font-size:10px;color:#7a8290;margin-bottom:8px">The main factors the AI considered in this request:</div>${a.factors.map(f=>`<div class="factor"><div><b>${esc(f[0])}</b><p>${esc(f[2])}</p></div><span class="impact ${f[1].toLowerCase()}">${f[1]} impact</span></div>`).join('')}</div><div class="sec"><h3>AI Explanation</h3><div class="explain">✦ ${esc(a.explanation)}</div></div><div class="feedback"><div class="sec"><h3>Staff Feedback</h3><div style="font-size:11px;font-weight:600;margin-bottom:8px">Was this AI assessment accurate?</div><div class="choice"><button id="goodBtn" onclick="setAccurate(true)">👍 Accurate</button><button id="badBtn" onclick="setAccurate(false)">👎 Needs improvement</button></div></div><div class="sec"><h3>Overall rating</h3><div class="stars">${[1,2,3,4,5].map(n=>`<button id="star${n}" onclick="setRating(${n})">★</button>`).join('')}</div></div><div class="sec"><label style="font-size:11px;font-weight:600">Additional feedback <span style="font-weight:400;color:#7a8290">(optional)</span></label><textarea id="feedbackText" maxlength="1000" placeholder="e.g. Priority should be higher because the student mentioned an upcoming exam."></textarea></div><button class="btn primary submit" onclick="submitFeedback('${id}')">Submit Feedback</button><div id="feedbackHint" style="text-align:center;color:#7a8290;font-size:9px;margin-top:7px">Select Accurate or Needs improvement to submit.</div></div>`;feedback={accurate:null,rating:null,comment:''};document.getElementById('sheetBackdrop').classList.add('open')}
function setAccurate(v){feedback.accurate=v;document.getElementById('goodBtn').className=v?'sel-good':'';document.getElementById('badBtn').className=!v?'sel-bad':'';document.getElementById('feedbackHint').textContent=''}
function setRating(v){feedback.rating=v;[1,2,3,4,5].forEach(n=>document.getElementById('star'+n).classList.toggle('on',n<=v))}
function submitFeedback(id){if(feedback.accurate===null){document.getElementById('feedbackHint').textContent='Select Accurate or Needs improvement to submit.';return}feedback.comment=document.getElementById('feedbackText').value.trim();document.getElementById('sheetBody').innerHTML=`<div style="padding:45px 15px;text-align:center"><div style="font-size:28px;color:#2e8b57">✓</div><h3 style="font-size:13px">Thanks for your feedback</h3><p style="font-size:10px;color:#7a8290;line-height:1.5">It will be used to evaluate and improve how cases are prioritized.</p></div>`;toast('Feedback submitted for '+id)}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',2600)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));document.getElementById('closeSheet').onclick=()=>document.getElementById('sheetBackdrop').classList.remove('open');document.getElementById('sheetBackdrop').addEventListener('click',e=>{if(e.target.id==='sheetBackdrop')e.currentTarget.classList.remove('open')});render();
</script>
</body>
</html>
